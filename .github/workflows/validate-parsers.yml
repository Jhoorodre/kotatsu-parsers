name: Validate Kotatsu Parsers

on:
  push:
    branches: [ master, main, minhas-fontes-custom ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  validate:
    name: Build & Validate Kotlin Parsers
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build and Validate Kotlin Code
        run: |
          echo "🔍 Compilando projeto para verificar erros de sintaxe..."
          ./gradlew build -x test
          
      - name: Validate Sources.md Integrity
        run: |
          echo "📋 Verificando a documentação docs/Sources.md..."
          if [ ! -f "docs/Sources.md" ]; then
            echo "❌ ERRO: docs/Sources.md não encontrado."
            exit 1
          fi
          
          # Procura por fontes duplicadas na tabela principal
          DUPLICATES=$(grep -Eo '\| [a-zA-Z0-9 ]+ \|' docs/Sources.md | sort | uniq -d | egrep -v 'Nome|Arquivo Kotlin|URL')
          if [ ! -z "$DUPLICATES" ]; then
            echo "⚠️ Aviso: Possíveis fontes duplicadas encontradas:"
            echo "$DUPLICATES"
          fi
          
          echo "✅ Validação da documentação concluída."

      - name: Generate Validation Report
        run: |
          echo "📋 **Relatório de Parsers Validados**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Nome do Parser | Domínio / URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------------|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Extrai a tabela inteira da seção de ativos usando awk
          awk '
            /## 🟢 Ativas/ { flag=1; next }
            /## 🟡/ { flag=0 }
            flag && /^\|.*\|.*\|.*\|$/ && !/Nome/ && !/---/ {
                split($0, arr, "|")
                name = arr[2]
                domain = arr[3]
                print "|" name "|" domain "| ✅ Validado |"
            }
          ' docs/Sources.md >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Todos os parsers Kotlin foram compilados com sucesso!**" >> $GITHUB_STEP_SUMMARY
